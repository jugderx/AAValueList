<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#8a8a8f;--ln:#ececee;--hi:#f6f6f8;--ac:#6b5bd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#ececee;--mu:#8b8b93;--ln:#26262b;--hi:#1b1b1f;--ac:#a79bff}}
:root[data-theme="dark"]{--bg:#121214;--fg:#ececee;--mu:#8b8b93;--ln:#26262b;--hi:#1b1b1f;--ac:#a79bff}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:24px 0 12px;z-index:2;border-bottom:1px solid var(--ln)}
input{width:100%;font:inherit;color:var(--fg);background:var(--hi);border:1px solid transparent;border-radius:10px;padding:12px 14px;outline:none}
input:focus{border-color:var(--ac)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{font:inherit;font-size:14px;color:var(--mu);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 14px 8px;cursor:pointer}
.tab:hover{color:var(--fg);border-color:transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cnt{color:var(--mu);font-size:12.5px}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--hi);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:14px 10px 10px}
td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
tr.s td{padding:22px 10px 8px;color:var(--mu);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--ln);background:none}
tr:hover td{background:var(--hi)}
tr.s:hover td{background:none}
.n{font-weight:500}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sh{color:var(--ac)}
.dash{color:var(--mu)}
.sub{color:var(--mu);font-size:12.5px}
.src{color:var(--mu)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.empty{padding:40px 0;text-align:center;color:var(--mu);display:none}
</style>
</head>

const TR={Stable:['#6aa84f','Стабильный'],Hyped:['#00d8e8','Хайпует'],Unstable:['#d5a6bd','Нестабильный'],Rising:['#22d322','Растёт'],Declining:['#cc2222','Падает'],Overpriced:['#8a0f0f','Переоценён']};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const trend=t=>{const x=TR[t];return x?`<div class="sub"><span class="dot" style="background:${x[0]}"></span>${x[1]}</div>`:''};
const cell=(p,d,t)=>{if(!p&&!d)return '<span class="dash">—</span>';return (p?`<div class="num">${esc(p)}</div>`:'<div class="sub">цены нет</div>')+(d?`<div class="sub">✦ ${esc(d)}</div>`:'')+trend(t)};
const pn=x=>x?parseFloat(String(x).replace(/,/g,'')):NaN;
let tab='units',dir=-1;
function key(r){const m=Math.max(pn(r.v)||0,pn(r.s)||0);return m>0?m:null}
function cmp(a,b){const x=key(a),y=key(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return (x-y)*dir}
function render(){
  const t=$('q').value.trim().toLowerCase(),u=tab==='units',secs=DATA[tab];
  $('h').innerHTML='<tr><th>Имя</th><th>Валюта</th>'+(u?'<th>Shiny</th>':'')+'<th>'+(tab==='gp'?'Описание':'Откуда')+'</th></tr>';
  let html='',n=0,tot=0;
  for(const s of secs){
    tot+=s.r.length;
    const l=(t?s.r.filter(r=>r.n.toLowerCase().includes(t)):s.r.slice()).sort(cmp);
    if(!l.length)continue;n+=l.length;
    if(s.t)html+=`<tr class="s"><td colspan="${u?4:3}">${esc(s.t)}</td></tr>`;
    html+=l.map(r=>`<tr><td class="n">${esc(r.n)}</td><td>${cell(r.v,r.d,r.t)}</td>${u?`<td class="sh">${cell(r.s,r.ds,r.ts)}</td>`:''}<td class="src">${esc(r.i||'—')}</td></tr>`).join('');
  }
  $('b').innerHTML=html;
  $('c').textContent=n+' из '+tot;
  $('e').style.display=n?'none':'block';
  $('s').textContent=dir<0?'Сначала дорогие ↓':'Сначала дешёвые ↑';
}
$('q').addEventListener('input',render);
$('s').addEventListener('click',()=>{dir=-dir;render()});
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();
});
render();
</script>
